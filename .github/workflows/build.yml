name: Build private KikisApp

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private branch, tag, or commit"
        required: true
        type: string
        default: "app_widgets"
      run_tests:
        description: "Run existing Swift and Widget checks"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "kikis-build-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Unsigned iOS 27 IPA
    runs-on: xcode-27
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source from private repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: gitupdate/qiqu_web
          ref: ${{ inputs.source_ref }}
          path: private-source
          fetch-depth: 1
          ssh-key: ${{ secrets.KIKIS_PRIVATE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify Xcode 27 and iOS 27 SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          test "${sdk_version%%.*}" -ge 27

      - name: Run original Swift and Widget tests
        if: inputs.run_tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/KikisPrivateLogs"
          cd "$GITHUB_WORKSPACE/private-source"
          exec 3>&1
          trap 'echo "::error::Private tests failed. Download encrypted diagnostics." >&3' ERR
          exec > "$RUNNER_TEMP/KikisPrivateLogs/tests.log" 2>&1

          swiftc -swift-version 5 \
            ios/KikisApp/RefreshCoordinator.swift \
            ios/scripts/test-refresh-coordinator.swift \
            -o "$RUNNER_TEMP/KikisRefreshCoordinatorTests"
          "$RUNNER_TEMP/KikisRefreshCoordinatorTests"

          swiftc -swift-version 5 \
            ios/KikisApp/TicketDepositPolicy.swift \
            ios/scripts/test-ticket-deposit-policy.swift \
            -o "$RUNNER_TEMP/KikisTicketDepositTests"
          "$RUNNER_TEMP/KikisTicketDepositTests"
          python3 ios/scripts/check-ticket-deposit-layout.py

          if test -f ios/scripts/test-withdraw-history.swift; then
            history_models=ios/Shared/WithdrawHistoryModels.swift
            if ! test -f "$history_models"; then
              history_models=ios/KikisApp/WithdrawHistoryModels.swift
            fi
            swiftc -swift-version 5 \
              "$history_models" \
              ios/scripts/test-withdraw-history.swift \
              -o "$RUNNER_TEMP/KikisWithdrawHistoryTests"
            "$RUNNER_TEMP/KikisWithdrawHistoryTests"
          fi

          if test -f ios/scripts/test-widget-balances.swift; then
            # app_widgets-specific WidgetKit model, balance and network tests.
            widget_sources=(ios/Shared/BalanceSummary.swift ios/Shared/WidgetBalanceClient.swift)
            if test -f ios/Shared/WidgetWithdrawSummary.swift; then
              widget_sources+=(ios/Shared/WithdrawHistoryModels.swift ios/Shared/WidgetWithdrawSummary.swift)
            fi
            swiftc -swift-version 5 \
              "${widget_sources[@]}" \
              ios/scripts/test-widget-balances.swift \
              -o "$RUNNER_TEMP/KikisWidgetBalanceTests"
            "$RUNNER_TEMP/KikisWidgetBalanceTests"
            if test -f ios/scripts/test-widget-withdraw-history.swift; then
              swiftc -swift-version 5 \
                "${widget_sources[@]}" \
                ios/scripts/test-widget-withdraw-history.swift \
                -o "$RUNNER_TEMP/KikisWidgetWithdrawTests"
              "$RUNNER_TEMP/KikisWidgetWithdrawTests"
            fi
          elif test -f ios/scripts/test-widget-models.swift; then
            # Legacy source branch.
            swiftc -swift-version 5 -D WIDGET_MODEL_TESTS \
              ios/Shared/WidgetSnapshot.swift \
              ios/Shared/DepositActivityAttributes.swift \
              ios/scripts/test-widget-models.swift \
              -o "$RUNNER_TEMP/KikisWidgetModelTests"
            "$RUNNER_TEMP/KikisWidgetModelTests"
            swiftc -swift-version 5 \
              ios/Shared/WidgetSnapshot.swift \
              ios/KikisWidgets/WidgetBalanceClient.swift \
              ios/scripts/test-widget-network.swift \
              -o "$RUNNER_TEMP/KikisWidgetNetworkTests"
            "$RUNNER_TEMP/KikisWidgetNetworkTests"
            python3 ios/scripts/check-widget-configuration.py
          else
            echo "No matching Widget model tests for selected source branch" >&2
            exit 1
          fi

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/KikisPrivateLogs"
          cd "$GITHUB_WORKSPACE/private-source"
          exec 3>&1
          trap 'echo "::error::iOS build failed. Download encrypted diagnostics." >&3' ERR
          exec > "$RUNNER_TEMP/KikisPrivateLogs/build.log" 2>&1
          xcodebuild \
            -project ios/KikisApp.xcodeproj \
            -scheme KikisApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/KikisDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/KikisPrivateLogs"
          exec 3>&1
          trap 'echo "::error::IPA packaging failed. Download encrypted diagnostics." >&3' ERR
          exec > "$RUNNER_TEMP/KikisPrivateLogs/package.log" 2>&1
          app="$RUNNER_TEMP/KikisDerivedData/Build/Products/Release-iphoneos/KikisApp.app"
          test -f "$app/Info.plist"
          if test -f "$app/PlugIns/KikisWidget.appex/Info.plist"; then
            # app_widgets embeds a singular KikisWidget.appex.
            python3 "$GITHUB_WORKSPACE/private-source/ios/scripts/check-widget-package.py" \
              "$app" "$RUNNER_TEMP/KikisPrivateLogs" \
              > "$RUNNER_TEMP/KikisPrivateLogs/widget-package-check.log" 2>&1
            cp "$GITHUB_WORKSPACE/private-source/ios/WIDGET_SIGNING.md" \
              "$RUNNER_TEMP/KikisPrivateLogs/KikisWidget-signing-guide.md"
          elif test -f "$app/PlugIns/KikisWidgets.appex/Info.plist"; then
            # Legacy branch: Widgets.appex plus Live Activities.
            /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$app/Info.plist" | grep -q true
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' \
              "$app/PlugIns/KikisWidgets.appex/Info.plist" | grep -q com.apple.widgetkit-extension
          else
            echo "::error::The build did not embed a recognized WidgetKit extension."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/KikisPackage/Payload"
          ditto "$app" "$RUNNER_TEMP/KikisPackage/Payload/KikisApp.app"
          (cd "$RUNNER_TEMP/KikisPackage" && zip -q -r "$RUNNER_TEMP/KikisApp-unsigned.ipa" Payload)
          if ! unzip -t "$RUNNER_TEMP/KikisApp-unsigned.ipa" > "$RUNNER_TEMP/KikisPrivateLogs/ipa-check.log" 2>&1; then
            echo "::error::IPA integrity check failed. Download encrypted diagnostics."
            exit 1
          fi
          shasum -a 256 "$RUNNER_TEMP/KikisApp-unsigned.ipa" > "$RUNNER_TEMP/KikisPrivateLogs/ipa-sha256.txt"

      - name: Encrypt IPA and private build diagnostics
        if: always()
        env:
          KIKIS_ARTIFACT_PASSWORD: ${{ secrets.KIKIS_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KIKIS_ARTIFACT_PASSWORD"
          mkdir -p "$RUNNER_TEMP/KikisPrivateLogs"
          if test -f "$RUNNER_TEMP/KikisApp-unsigned.ipa"; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in "$RUNNER_TEMP/KikisApp-unsigned.ipa" \
              -out "$GITHUB_WORKSPACE/KikisApp-unsigned.ipa.enc" \
              -pass env:KIKIS_ARTIFACT_PASSWORD
          fi
          mkdir -p "$RUNNER_TEMP/KikisPrivateBundle"
          ditto "$RUNNER_TEMP/KikisPrivateLogs" "$RUNNER_TEMP/KikisPrivateBundle/diagnostics"
          if test -d "$RUNNER_TEMP/KikisUIReview"; then
            ditto "$RUNNER_TEMP/KikisUIReview" "$RUNNER_TEMP/KikisPrivateBundle/ui-review"
          fi
          if test -d "$RUNNER_TEMP/KikisWidgetIntegration"; then
            ditto "$RUNNER_TEMP/KikisWidgetIntegration" "$RUNNER_TEMP/KikisPrivateBundle/widget-integration"
          fi
          if test -z "$(find "$RUNNER_TEMP/KikisPrivateBundle" -type f -print -quit)"; then
            echo "No diagnostics generated" > "$RUNNER_TEMP/KikisPrivateBundle/status.txt"
          fi
          tar -czf "$RUNNER_TEMP/KikisDiagnostics.tar.gz" -C "$RUNNER_TEMP/KikisPrivateBundle" .
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/KikisDiagnostics.tar.gz" \
            -out "$GITHUB_WORKSPACE/KikisDiagnostics.tar.gz.enc" \
            -pass env:KIKIS_ARTIFACT_PASSWORD
          rm -f "$RUNNER_TEMP/KikisDiagnostics.tar.gz"

      - name: Publish encrypted artifacts only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: KikisApp-build-${{ github.run_number }}
          path: |
            KikisApp-unsigned.ipa.enc
            KikisDiagnostics.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  ui-review:
    name: iPhone 15 visual review
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source from private repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: gitupdate/qiqu_web
          ref: ${{ inputs.source_ref }}
          path: private-source
          fetch-depth: 1
          ssh-key: ${{ secrets.KIKIS_PRIVATE_DEPLOY_KEY }}
          persist-credentials: false


      - name: Build simulator app with isolated review data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/KikisPrivateLogs"
          cd "$GITHUB_WORKSPACE/private-source"
          exec 3>&1
          trap 'echo "::error::Simulator build failed. Download encrypted UI diagnostics." >&3' ERR
          exec > "$RUNNER_TEMP/KikisPrivateLogs/simulator-build.log" 2>&1
          xcodebuild \
            -project ios/KikisApp.xcodeproj \
            -scheme KikisApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/KikisReviewBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG UI_REVIEW' \
            build

      - name: Capture light, dark and accessibility layouts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/KikisPrivateLogs"
          cd "$GITHUB_WORKSPACE/private-source"
          exec 3>&1
          trap 'echo "::error::iPhone 15 screenshot capture failed. Download encrypted UI diagnostics." >&3' ERR
          exec > "$RUNNER_TEMP/KikisPrivateLogs/capture-ui.log" 2>&1
          UI_REVIEW_APP="$RUNNER_TEMP/KikisReviewBuild/Build/Products/Debug-iphonesimulator/KikisApp.app" \
            bash ios/scripts/capture-ui.sh

      - name: Encrypt UI screenshots and diagnostic logs
        if: always()
        env:
          KIKIS_ARTIFACT_PASSWORD: ${{ secrets.KIKIS_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KIKIS_ARTIFACT_PASSWORD"
          mkdir -p "$RUNNER_TEMP/KikisPrivateLogs" "$RUNNER_TEMP/KikisUIBundle"
          ditto "$RUNNER_TEMP/KikisPrivateLogs" "$RUNNER_TEMP/KikisUIBundle/diagnostics"
          if test -d "$RUNNER_TEMP/KikisUIReview"; then
            ditto "$RUNNER_TEMP/KikisUIReview" "$RUNNER_TEMP/KikisUIBundle/screenshots"
          fi
          tar -czf "$RUNNER_TEMP/KikisUIReview.tar.gz" -C "$RUNNER_TEMP/KikisUIBundle" .
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/KikisUIReview.tar.gz" \
            -out "$GITHUB_WORKSPACE/KikisUIReview.tar.gz.enc" \
            -pass env:KIKIS_ARTIFACT_PASSWORD
          rm -f "$RUNNER_TEMP/KikisUIReview.tar.gz"

      - name: Upload encrypted UI review only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: KikisApp-ui-review-${{ github.run_number }}
          path: KikisUIReview.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  widget-integration:
    name: Widget extension validation
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source from private repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: gitupdate/qiqu_web
          ref: ${{ inputs.source_ref }}
          path: private-source
          fetch-depth: 1
          ssh-key: ${{ secrets.KIKIS_PRIVATE_DEPLOY_KEY }}
          persist-credentials: false


      - name: Validate widget extension for selected source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/KikisPrivateLogs"
          cd "$GITHUB_WORKSPACE/private-source"
          exec 3>&1
          trap 'echo "::error::Widget integration failed. Download encrypted diagnostics." >&3' ERR
          exec > "$RUNNER_TEMP/KikisPrivateLogs/widget-integration.log" 2>&1
          if test -f ios/scripts/test-home-widget.sh; then
            # Legacy source: executes the real Widget gallery XCTest.
            bash ios/scripts/test-home-widget.sh
          elif test -f ios/scripts/test-widget-balances.swift; then
            # app_widgets defines no XCTest target. Exercise pure-model tests
            # plus installation of the embedded extension and host launch on iPhone 15.
            mkdir -p "$RUNNER_TEMP/KikisWidgetIntegration"
            widget_sources=(ios/Shared/BalanceSummary.swift ios/Shared/WidgetBalanceClient.swift)
            if test -f ios/Shared/WidgetWithdrawSummary.swift; then
              widget_sources+=(ios/Shared/WithdrawHistoryModels.swift ios/Shared/WidgetWithdrawSummary.swift)
            fi
            swiftc -swift-version 5 \
              "${widget_sources[@]}" \
              ios/scripts/test-widget-balances.swift \
              -o "$RUNNER_TEMP/KikisWidgetBalanceIntegrationTests"
            "$RUNNER_TEMP/KikisWidgetBalanceIntegrationTests"
            if test -f ios/scripts/test-widget-withdraw-history.swift; then
              swiftc -swift-version 5 \
                "${widget_sources[@]}" \
                ios/scripts/test-widget-withdraw-history.swift \
                -o "$RUNNER_TEMP/KikisWidgetWithdrawIntegrationTests"
              "$RUNNER_TEMP/KikisWidgetWithdrawIntegrationTests"
            fi

            xcodebuild \
              -project ios/KikisApp.xcodeproj \
              -scheme KikisApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/KikisWidgetTestBuild" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG UI_REVIEW' \
              build

            simulator_app="$RUNNER_TEMP/KikisWidgetTestBuild/Build/Products/Debug-iphonesimulator/KikisApp.app"
            test -f "$simulator_app/Info.plist"
            python3 ios/scripts/check-widget-package.py \
              "$simulator_app" "$RUNNER_TEMP/KikisWidgetIntegration"

            xcrun simctl list runtimes --json > "$RUNNER_TEMP/KikisWidgetIntegration/runtimes.json"
            runtime_id="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1]))["runtimes"]; a=[x for x in r if x.get("isAvailable") and x.get("version","").split(".")[0]=="27" and "iOS" in x["name"]]; print(a[-1]["identifier"] if a else sys.exit("No iOS 27 simulator runtime"))' "$RUNNER_TEMP/KikisWidgetIntegration/runtimes.json")"
            simulator_id="$(xcrun simctl create 'Kikis Widget Integration' com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$runtime_id")"
            trap 'xcrun simctl shutdown "$simulator_id" >/dev/null 2>&1 || true; xcrun simctl delete "$simulator_id" >/dev/null 2>&1 || true' EXIT
            xcrun simctl boot "$simulator_id"
            xcrun simctl bootstatus "$simulator_id" -b
            xcrun simctl install "$simulator_id" "$simulator_app"
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$simulator_app/Info.plist")"
            installed_app="$(xcrun simctl get_app_container "$simulator_id" "$bundle_id" app)"
            test -f "$installed_app/PlugIns/KikisWidget.appex/Info.plist"
            test -f "$installed_app/PlugIns/KikisWidget.appex/KikisWidget"
            xcrun simctl launch "$simulator_id" "$bundle_id" --ui-review home
            echo "PASS: iPhone 15 installed and launched app with WidgetKit extension"
          else
            echo "Unknown Widget source layout; cannot run integration" >&2
            exit 1
          fi

      - name: Export widget test screenshots
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/KikisPrivateLogs"
          result_path="$RUNNER_TEMP/KikisWidgetIntegration/WidgetIntegration.xcresult"
          if [[ -d "$result_path" ]]; then
            xcrun xcresulttool export attachments --path "$result_path" \
              --output-path "$RUNNER_TEMP/KikisWidgetIntegration/screenshots" \
              > "$RUNNER_TEMP/KikisPrivateLogs/widget-export.log" 2>&1 || true
          fi

      - name: Encrypt widget integration results
        if: always()
        env:
          KIKIS_ARTIFACT_PASSWORD: ${{ secrets.KIKIS_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KIKIS_ARTIFACT_PASSWORD"
          mkdir -p "$RUNNER_TEMP/KikisPrivateLogs" "$RUNNER_TEMP/KikisWidgetBundle"
          ditto "$RUNNER_TEMP/KikisPrivateLogs" "$RUNNER_TEMP/KikisWidgetBundle/diagnostics"
          if test -d "$RUNNER_TEMP/KikisWidgetIntegration"; then
            ditto "$RUNNER_TEMP/KikisWidgetIntegration" "$RUNNER_TEMP/KikisWidgetBundle/integration"
          fi
          tar -czf "$RUNNER_TEMP/KikisWidgetIntegration.tar.gz" -C "$RUNNER_TEMP/KikisWidgetBundle" .
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/KikisWidgetIntegration.tar.gz" \
            -out "$GITHUB_WORKSPACE/KikisWidgetIntegration.tar.gz.enc" \
            -pass env:KIKIS_ARTIFACT_PASSWORD
          rm -f "$RUNNER_TEMP/KikisWidgetIntegration.tar.gz"

      - name: Upload encrypted widget integration results only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: KikisApp-widget-integration-${{ github.run_number }}
          path: KikisWidgetIntegration.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
